# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Simon Giebenhain
tagline: Academic Website of Simon Giebenhain
email: simon.giebenhain@tum.de
description: > # this means to ignore newlines until "baseurl:"
  I am a PhD student at the Technical University of Munich, 
  interested in Virtual Avatars and Neural Scene Representations.
domain: simongiebenhain.github.io
url: https://simongiebenhain.github.io
baseurl: 
social:
  - https://github.com/SimonGiebenhain
  - https://scholar.google.com/citations?&user=nhRzTtEAAAAJ
  - https://www.linkedin.com/in/simon-giebenhain-14a497285/
  - https://twitter.com/SGiebenhain
google_site_verification:
plugins:
  - jekyll-seo-tag
author:
  name: Simon Giebenhain
  url: https://simongiebenhain.github.io
  twitter: SGiebenhain

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
